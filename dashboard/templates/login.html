<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — TOD Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #ddd;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 360px;
      padding: 0 1.5rem;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: #2563eb;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.75rem;
    }

    .logo-icon svg { width: 22px; height: 22px; color: #fff; }

    .logo h1 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #eee;
    }

    .logo p {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.2rem;
    }

    .form-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1.75rem;
    }

    .error-msg {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
      font-size: 0.82rem;
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      margin-bottom: 1.1rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.45rem;
    }

    input[type="password"] {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      color: #eee;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 1.2rem;
    }

    input[type="password"]:focus { border-color: #2563eb; }

    button[type="submit"] {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.65rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    button[type="submit"]:hover { background: #1d4ed8; }
    button[type="submit"]:active { background: #1e40af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 10l4.553-2.069A1 1 0 0121 8.82v6.36a1 1 0 01-1.447.894L15 14
                   M3 8h12a2 2 0 012 2v4a2 2 0 01-2 2H3a2 2 0 01-2-2v-4a2 2 0 012-2z"/>
        </svg>
      </div>
      <h1>TOD Dashboard</h1>
      <p>Camera management console</p>
    </div>

    <div class="form-box">
      {% if error %}
      <div class="error-msg">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2
                   0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102
                   0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        {% if error == "no_password" %}
          DASHBOARD_PASSWORD is not configured on the server.
        {% else %}
          Incorrect password. Try again.
        {% endif %}
      </div>
      {% endif %}

      <form method="POST" action="/login">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autofocus placeholder="Enter dashboard password">
        <button type="submit">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
